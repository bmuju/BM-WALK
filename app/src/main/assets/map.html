<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BM WALK Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map {
      width: 100%;
      height: 100%;
      background: #081B2B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .leaflet-container {
      background: #081B2B !important;
    }
    .leaflet-control-zoom {
      border: 1px solid rgba(82, 245, 209, 0.25) !important;
      border-radius: 12px !important;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5) !important;
    }
    .leaflet-control-zoom a {
      background: rgba(16, 45, 66, 0.9) !important;
      color: #52F5D1 !important;
      border-color: rgba(82, 245, 209, 0.15) !important;
      backdrop-filter: blur(8px);
    }
    .leaflet-control-zoom a:hover {
      background: #163852 !important;
    }
    .leaflet-control-attribution {
      background: rgba(8, 27, 43, 0.7) !important;
      color: #9BB7C8 !important;
      font-size: 9px !important;
      border-top-left-radius: 6px;
    }
    .leaflet-control-attribution a {
      color: #52F5D1 !important;
      text-decoration: none;
    }
    /* Pulsing user marker */
    .user-marker {
      width: 22px;
      height: 22px;
      position: relative;
    }
    .user-marker-core {
      width: 14px;
      height: 14px;
      background: #52F5D1;
      border: 2.5px solid #F2FAFF;
      border-radius: 50%;
      position: absolute;
      top: 4px;
      left: 4px;
      box-shadow: 0 0 14px #52F5D1;
      z-index: 2;
    }
    .user-marker-pulse {
      width: 26px;
      height: 26px;
      background: rgba(82, 245, 209, 0.4);
      border-radius: 50%;
      position: absolute;
      top: -2px;
      left: -2px;
      animation: pulse 1.8s infinite ease-out;
      z-index: 1;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    /* Start Pin */
    .start-marker {
      width: 18px;
      height: 18px;
      background: #8A78FF;
      border: 2px solid #F2FAFF;
      border-radius: 50%;
      box-shadow: 0 0 12px #8A78FF;
    }
    /* Ambient map grid background when tiles loading */
    .grid-backdrop {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(82, 245, 209, 0.05) 0%, transparent 70%),
        linear-gradient(rgba(22, 56, 82, 0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22, 56, 82, 0.3) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="grid-backdrop"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    var map;
    var userMarker = null;
    var startMarker = null;
    var accuracyCircle = null;
    var polyline = null;
    var glowPolyline = null;
    var routeCoordinates = [];
    var autoFollow = true;

    function initMap() {
      // Default to neutral center until GPS fix
      map = L.map('map', {
        zoomControl: false,
        attributionControl: true
      }).setView([0, 0], 2);

      L.control.zoom({ position: 'topright' }).addTo(map);

      // CartoDB Dark Matter Tiles (High contrast, dark ocean palette matching Aurora Glass)
      var darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://openstreetmap.org">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19,
        minZoom: 1
      });

      // Fallback OpenStreetMap standard tile layer
      var osmTiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      });

      darkTiles.addTo(map);
      darkTiles.on('tileerror', function() {
        if (!map.hasLayer(osmTiles)) {
          osmTiles.addTo(map);
        }
      });

      // Custom Aurora Glow Polyline: Dual layered
      glowPolyline = L.polyline([], {
        color: '#8A78FF',
        weight: 8,
        opacity: 0.35,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      polyline = L.polyline([], {
        color: '#52F5D1',
        weight: 4,
        opacity: 0.95,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      map.on('dragstart', function() {
        autoFollow = false;
      });
    }

    var userIcon = L.divIcon({
      className: 'user-marker',
      html: '<div class="user-marker-pulse"></div><div class="user-marker-core"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    var startIcon = L.divIcon({
      className: 'start-marker',
      html: '',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    function updateLivePosition(lat, lng, accuracy, follow) {
      if (!map) return;
      var latLng = [lat, lng];

      if (!userMarker) {
        userMarker = L.marker(latLng, { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
        map.setView(latLng, 16);
      } else {
        userMarker.setLatLng(latLng);
      }

      if (accuracyCircle) {
        accuracyCircle.setLatLng(latLng);
        accuracyCircle.setRadius(accuracy || 10);
      } else {
        accuracyCircle = L.circle(latLng, {
          radius: accuracy || 10,
          color: '#52F5D1',
          weight: 1,
          opacity: 0.25,
          fillColor: '#52F5D1',
          fillOpacity: 0.08
        }).addTo(map);
      }

      if (follow || autoFollow) {
        map.panTo(latLng, { animate: true, duration: 0.5 });
      }
    }

    function addRoutePoint(lat, lng) {
      if (!map) return;
      var latLng = [lat, lng];
      routeCoordinates.push(latLng);

      if (routeCoordinates.length === 1 && !startMarker) {
        startMarker = L.marker(latLng, { icon: startIcon, zIndexOffset: 900 }).addTo(map);
      }

      polyline.setLatLngs(routeCoordinates);
      glowPolyline.setLatLngs(routeCoordinates);
    }

    function setFullRoute(coordsJson) {
      if (!map) return;
      try {
        var points = JSON.parse(coordsJson);
        routeCoordinates = points.map(function(p) { return [p.lat, p.lng]; });
        polyline.setLatLngs(routeCoordinates);
        glowPolyline.setLatLngs(routeCoordinates);

        if (routeCoordinates.length > 0) {
          if (!startMarker) {
            startMarker = L.marker(routeCoordinates[0], { icon: startIcon }).addTo(map);
          } else {
            startMarker.setLatLng(routeCoordinates[0]);
          }

          var bounds = L.latLngBounds(routeCoordinates);
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 17 });
        }
      } catch (e) {
        console.error("Failed to parse coordsJson", e);
      }
    }

    function centerOnUser() {
      autoFollow = true;
      if (userMarker) {
        map.setView(userMarker.getLatLng(), 17, { animate: true });
      }
    }

    function fitAllRoute() {
      if (routeCoordinates.length > 1) {
        map.fitBounds(polyline.getBounds(), { padding: [40, 40] });
      } else if (userMarker) {
        centerOnUser();
      }
    }

    window.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
</html>
